<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<title>House Construction Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HouseCost">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --green-dark:#1b4332;
    --green:#2d6a4f;
    --green-light:#40916c;
    --gold:#d4a017;
    --gold-light:#f1c453;
    --bg:#f7f6f2;
    --card:#ffffff;
    --text:#1b2a22;
    --muted:#6b7a70;
    --border:#e2e4df;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:linear-gradient(135deg,var(--green-dark),var(--green));
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;top:0;z-index:20;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:12px;
    opacity:.85;
    margin-top:2px;
  }
  .totalbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    background:rgba(255,255,255,.12);
    border-radius:10px;
    padding:10px 12px;
  }
  .totalbar .label{font-size:12px;opacity:.85;}
  .totalbar .value{font-size:20px;font-weight:800;color:var(--gold-light);}
  .sync-status{
    font-size:11px;opacity:.85;margin-top:8px;text-align:center;
  }
  .sync-status.synced{color:var(--gold-light);}
  .sync-status.offline{color:#ff9b8a;}

  /* Hamburger nav trigger + sidebar drawer */
  .header-top-row{
    display:flex;align-items:center;gap:10px;
  }
  .hamburger-btn{
    background:rgba(255,255,255,.15);
    border:none;color:#fff;
    font-size:18px;
    width:38px;height:38px;flex:0 0 auto;
    border-radius:10px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .hamburger-btn:active{background:rgba(255,255,255,.28);}
  .nav-trigger{
    margin-top:10px;
    display:flex;align-items:center;justify-content:space-between;
    background:rgba(255,255,255,.12);
    border:none;color:#fff;
    border-radius:10px;
    padding:9px 12px;
    font-size:13.5px;font-weight:600;
    width:100%;cursor:pointer;
  }
  .nav-trigger .nt-current{display:flex;align-items:center;gap:6px;}
  .nav-trigger .nt-chevron{opacity:.8;font-size:11px;}

  .sidebar-overlay{
    position:fixed;inset:0;z-index:150;
    background:rgba(0,0,0,.45);
    display:none;
  }
  .sidebar-panel{
    position:absolute;top:0;left:0;bottom:0;
    width:80%;max-width:300px;
    background:#fff;
    box-shadow:2px 0 20px rgba(0,0,0,.25);
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);
  }
  .sidebar-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 16px 12px;
    border-bottom:1px solid var(--border);
    font-weight:700;color:var(--green-dark);font-size:15px;
  }
  .sidebar-head button{
    background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 8px;
  }
  .sidebar-nav-list{
    overflow-y:auto;flex:1;padding:8px;
  }
  .sidebar-nav-item{
    display:block;width:100%;text-align:left;
    background:none;border:none;
    padding:12px 12px;border-radius:10px;
    font-size:14.5px;color:var(--text);font-weight:600;
    cursor:pointer;margin-bottom:2px;
  }
  .sidebar-nav-item:active{background:#f4f3ef;}
  .sidebar-nav-item.active{
    background:var(--green-dark);color:#fff;
  }
  .sidebar-nav-item.labour-item.active{
    background:var(--gold);color:#3a2b00;
  }
  .sidebar-section-label{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--muted);padding:12px 12px 4px;
  }

  main{padding:14px 12px 100px;max-width:720px;margin:0 auto;}

  .stage{
    background:var(--card);
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .stage-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 14px;
    background:linear-gradient(180deg,#fff,#fbfaf7);
  }
  .stage-head .name{
    font-size:17px;
    font-weight:700;
    color:var(--green-dark);
    display:flex;
    align-items:center;
    gap:8px;
    flex:1;
    min-width:0;
  }
  .stage-head .name input{
    border:none;background:transparent;font-weight:700;font-size:17px;color:var(--green-dark);
    width:100%;padding:2px 0;
  }
  .stage-sub{
    font-size:12px;color:var(--muted);margin-top:2px;
  }
  .items-wrap{border-top:1px solid var(--border);}
  .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;}
  table{width:100%;min-width:640px;border-collapse:collapse;}
  th{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);text-align:left;padding:8px 6px;
    background:#f4f3ef;white-space:nowrap;
  }
  th.num,td.num{text-align:right;}
  td{padding:8px 6px;border-top:1px solid var(--border);vertical-align:middle;}
  td input{
    width:100%;border:1px solid transparent;background:transparent;
    font-size:16px;padding:6px 4px;border-radius:6px;color:var(--text);
    font-family:inherit;
  }
  td input:focus{border:1px solid var(--green-light);background:#fff;outline:none;}
  td.qty input, td.price input{text-align:right;}
  .item-name{min-width:150px;width:150px;}
  .item-name input{font-weight:600;}
  td.qty, th:nth-child(2){min-width:70px;}
  td.unit-date-cell, th:nth-child(3){min-width:110px;}
  td.price, th:nth-child(4){min-width:100px;}
  td.num.rowline, th:nth-child(5){min-width:90px;}
  td.status-cell, th:nth-child(6){min-width:100px;}
  tr.labour-row{background:#fdf8e9;}
  tr.labour-row td{border-top-color:#f0e2b0;}
  .rowline{color:var(--muted);font-size:13px;}
  .del-btn{
    background:none;border:none;color:#b3413b;font-size:18px;
    padding:4px 8px;cursor:pointer;line-height:1;
  }
  .addrow-group{
    display:flex;gap:8px;padding:10px;
  }
  .addrow-group button{
    flex:1;
    background:none;border:1.5px dashed var(--green-light);
    color:var(--green);font-size:13px;font-weight:600;
    padding:8px 10px;border-radius:20px;cursor:pointer;
  }
  .addrow-group button.labour-btn{
    border-color:var(--gold);color:#8a6a00;
  }
  .stage-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;background:#f4f3ef;
    border-top:1px solid var(--border);
    gap:10px;
  }
  .stage-foot .stagetotal{font-weight:700;color:var(--green-dark);}
  .stage-del{
    background:none;border:none;color:#b3413b;font-size:12px;
    cursor:pointer;padding:4px;flex:0 0 auto;
  }
  .add-stage-btn{
    display:block;width:100%;
    background:var(--green-dark);color:#fff;
    border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;
    margin-top:6px;cursor:pointer;
  }
  .add-stage-btn:active{background:var(--green);}
  .toolbar{
    display:flex;gap:8px;margin-bottom:14px;
  }
  .toolbar button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:#fff;color:var(--green-dark);font-size:13px;font-weight:600;
    cursor:pointer;
  }
  footer{
    text-align:center;color:var(--muted);font-size:11px;padding:14px;
  }
  .empty{
    text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;
  }
  .unit-select{
    width:100%;border:none;background:transparent;font-size:14px;color:var(--text);
    font-family:inherit;padding:6px 2px;
  }
  select:focus, .unit-select:focus{outline:none;border:1px solid var(--green-light);border-radius:6px;background:#fff;}

  .status-select{
    border:none;border-radius:14px;
    font-size:11px;font-weight:700;letter-spacing:.3px;
    padding:5px 9px;text-align:center;
    cursor:pointer;font-family:inherit;
    -webkit-appearance:none;appearance:none;
  }
  .status-select.status-paid{background:#dcf3e5;color:#1b7a3d;}
  .status-select.status-pending{background:#fde8d8;color:#b3541b;}
  .status-select:disabled{opacity:.85;cursor:default;}
  .status-tag{
    display:inline-block;border-radius:14px;
    font-size:10.5px;font-weight:700;letter-spacing:.3px;
    padding:3px 9px;
  }
  .status-tag.status-paid{background:#dcf3e5;color:#1b7a3d;}
  .status-tag.status-pending{background:#fde8d8;color:#b3541b;}

  .filter-bar{
    display:flex;gap:8px;padding:10px 14px;
    background:#f4f3ef;border-bottom:1px solid var(--border);
    flex-wrap:wrap;
  }
  .filter-bar select{
    flex:1;min-width:100px;
    font-size:13px;padding:7px 8px;border-radius:8px;
    border:1px solid var(--border);background:#fff;color:var(--text);
    font-family:inherit;
  }
  .filter-bar select:focus{outline:none;border-color:var(--green-light);}
  .filtered-total{
    padding:8px 14px;background:#eef6f1;color:var(--green-dark);
    font-size:12.5px;font-weight:700;border-bottom:1px solid var(--border);
  }
  .filtered-total .ft-count{font-weight:500;color:var(--muted);}

  .manage-names-btn{
    display:block;width:100%;text-align:center;
    background:none;border:1.5px dashed var(--border);
    color:var(--green-dark);font-size:12.5px;font-weight:600;
    padding:8px;border-radius:10px;cursor:pointer;margin-bottom:12px;
  }
  .name-row{
    display:flex;align-items:center;gap:8px;
    padding:7px 0;border-bottom:1px solid var(--border);
  }
  .name-row input{
    flex:1;border:1px solid transparent;background:transparent;
    font-size:14px;padding:6px 4px;border-radius:6px;color:var(--text);
    font-family:inherit;
  }
  .name-row input:focus{border-color:var(--green-light);background:#fdfdfc;outline:none;}
  .name-row button{
    background:none;border:none;color:#b3413b;font-size:16px;
    cursor:pointer;padding:4px 6px;flex:0 0 auto;
  }

  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:16px;
    padding:6px 8px;cursor:pointer;line-height:1;border-radius:8px;
  }
  .icon-btn:active{background:rgba(0,0,0,.06);}

  /* Overview page */
  .ov-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;
    display:flex;align-items:center;gap:10px;
  }
  .ov-card .ov-main{flex:1;min-width:0;cursor:pointer;}
  .ov-card .ov-name{font-weight:700;color:var(--green-dark);font-size:15px;}
  .ov-card .ov-sub{font-size:12px;color:var(--muted);margin-top:2px;}
  .ov-card .ov-total{font-weight:700;color:var(--green-dark);font-size:14px;white-space:nowrap;}
  .ov-controls{display:flex;flex-direction:column;gap:2px;align-items:center;}
  .ov-controls button{
    background:none;border:1px solid var(--border);color:var(--green-dark);
    font-size:11px;padding:2px 7px;border-radius:6px;cursor:pointer;
  }
  .ov-controls button:disabled{opacity:.3;}
  .ov-del{
    background:none;border:none;color:#b3413b;font-size:16px;cursor:pointer;padding:4px;
  }
  .grand-summary{
    background:linear-gradient(135deg,var(--green-dark),var(--green));
    color:#fff;border-radius:14px;padding:16px;margin-bottom:16px;
  }
  .grand-summary .gs-label{font-size:12px;opacity:.85;}
  .grand-summary .gs-value{font-size:26px;font-weight:800;color:var(--gold-light);margin-top:2px;}
  .grand-summary .gs-breakdown{font-size:12px;opacity:.9;margin-top:8px;}

  /* Labour page */
  .labour-role-card{
    background:var(--card);border:1px solid var(--border);border-radius:12px;
    margin-bottom:10px;overflow:hidden;
  }
  .labour-role-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;background:#fdf8e9;
  }
  .labour-role-head .role-name{font-weight:700;color:#8a6a00;font-size:15px;}
  .labour-role-head .role-total{font-weight:700;color:#8a6a00;}
  .labour-entry{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 14px;border-top:1px solid #f0e2b0;font-size:13px;
  }
  .labour-entry .le-left{color:var(--text);}
  .labour-entry .le-stage{color:var(--muted);font-size:11.5px;}
  .labour-entry .le-right{font-weight:600;color:var(--green-dark);white-space:nowrap;}

  /* Confirm modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:14px;padding:20px;
    max-width:340px;width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .modal-box p{
    margin:0 0 18px;font-size:14.5px;color:var(--text);line-height:1.4;
  }
  .modal-actions{
    display:flex;gap:10px;
  }
  .modal-actions button{
    flex:1;padding:11px;border-radius:10px;border:none;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .modal-cancel{background:#eee;color:var(--text);}
  .modal-confirm{background:#b3413b;color:#fff;}

  /* PIN lock screen */
  .lock-overlay{
    position:fixed;inset:0;z-index:200;
    background:linear-gradient(160deg,var(--green-dark),var(--green));
    display:flex;align-items:center;justify-content:center;
    padding:20px;
  }
  .lock-box{
    background:#fff;border-radius:16px;padding:26px 22px;
    max-width:320px;width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    text-align:center;
  }
  .lock-box h2{margin:0 0 4px;color:var(--green-dark);font-size:18px;}
  .lock-box .lock-sub{color:var(--muted);font-size:12.5px;margin-bottom:18px;}
  .lock-box input{
    width:100%;text-align:center;letter-spacing:6px;font-size:22px;
    padding:12px;border:1.5px solid var(--border);border-radius:10px;
    margin-bottom:12px;font-family:inherit;
  }
  .lock-box input:focus{outline:none;border-color:var(--green-light);}
  .lock-box button{
    width:100%;padding:12px;border:none;border-radius:10px;
    background:var(--green-dark);color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;
  }
  .lock-box .lock-error{
    color:#b3413b;font-size:12.5px;margin-bottom:10px;min-height:16px;
  }
  .role-badge{
    display:inline-flex;align-items:center;gap:4px;
    font-size:11px;color:#fff;opacity:.85;
    background:rgba(255,255,255,.15);
    padding:3px 9px;border-radius:12px;
    border:none;cursor:pointer;margin-top:8px;
  }
</style>
</head>
<body>

<header>
  <div class="header-top-row">
    <button id="hamburgerBtn" class="hamburger-btn">☰</button>
    <div>
      <h1>🏗️ House Construction Tracker</h1>
      <div class="sub">Materials, labour &amp; costs by stage</div>
    </div>
  </div>
  <div class="totalbar">
    <div>
      <div class="label">Grand Total</div>
      <div class="value" id="grandTotal">Ksh 0</div>
    </div>
    <div style="text-align:right;">
      <div class="label">Items</div>
      <div class="value" id="itemCount" style="font-size:16px;">0</div>
    </div>
  </div>
  <div id="syncStatus" class="sync-status">🔄 Connecting…</div>
  <div style="text-align:center;">
    <button id="roleBadge" class="role-badge">🔒 …</button>
  </div>
  <button class="nav-trigger" id="navTrigger">
    <div class="nt-current" id="navTriggerLabel">🏠 Overview</div>
    <div class="nt-chevron">▾ menu</div>
  </button>
</header>

<div id="lockOverlay" class="lock-overlay">
  <div class="lock-box">
    <h2>🏗️ House Construction Tracker</h2>
    <div class="lock-sub">Enter your PIN to continue</div>
    <div class="lock-error" id="lockError"></div>
    <input type="password" id="lockPinInput" inputmode="numeric" maxlength="6" placeholder="PIN" autocomplete="off">
    <button id="lockUnlockBtn">Unlock</button>
  </div>
</div>

<div id="sidebarOverlay" class="sidebar-overlay">
  <div class="sidebar-panel" id="sidebarPanel">
    <div class="sidebar-head">
      <span>Navigate</span>
      <button id="sidebarCloseBtn">✕</button>
    </div>
    <div class="sidebar-nav-list" id="sidebarNavList"></div>
  </div>
</div>


<main>
  <div class="toolbar">
    <button id="installBtn" style="display:none;">📲 Install App</button>
    <button id="exportBtn">⬇ Export PDF</button>
    <button id="resetBtn">↺ Reset Sample</button>
  </div>

  <div id="pageContent"></div>
</main>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-confirm" id="modalConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<div id="namesModalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box" style="max-width:360px;text-align:left;">
    <p style="margin-bottom:10px;font-weight:700;color:var(--green-dark);">Manage labour names</p>
    <div id="namesList" style="max-height:280px;overflow-y:auto;margin-bottom:12px;"></div>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <input type="text" id="newNameInput" placeholder="New name" style="flex:1;padding:9px 10px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:14px;">
      <button id="newNameAddBtn" style="background:var(--green-dark);color:#fff;border:none;border-radius:8px;padding:0 14px;font-weight:700;cursor:pointer;">Add</button>
    </div>
    <div class="modal-actions">
      <button class="modal-cancel" id="namesModalCloseBtn" style="flex:1;">Done</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  function todayISO(){
    const d = new Date();
    const tz = d.getTimezoneOffset();
    const local = new Date(d.getTime() - tz*60000);
    return local.toISOString().slice(0,10);
  }

  function dowLabel(dateStr){
    if(!dateStr) return "";
    const d = new Date(dateStr + "T00:00:00");
    if(isNaN(d.getTime())) return "";
    const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    return days[d.getDay()];
  }

  function fmtDateWithDow(dateStr){
    if(!dateStr) return "No date";
    const dow = dowLabel(dateStr);
    return dow ? (dateStr + " (" + dow + ")") : dateStr;
  }

  function migrateData(data){
    data.forEach(stage=>{
      if(!stage.id) stage.id = makeId();
      (stage.items||[]).forEach(item=>{
        if(!item.type){
          const nameLc = (item.name||"").toLowerCase();
          item.type = (nameLc.indexOf("labour") !== -1 || nameLc.indexOf("labor") !== -1) ? "labour" : "material";
        }
        if(item.type === "labour" && !item.date){
          item.date = todayISO();
        }
        if(!item.status){
          item.status = "pending";
        }
      });
    });
    return data;
  }

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return migrateData(parsed);
      }
    }catch(e){}
    return migrateData(JSON.parse(JSON.stringify(SAMPLE_DATA)));
  }

  const LABOUR_NAMES_KEY = "houseConstructionLabourNames_v1";
  const DEFAULT_LABOUR_NAMES = ["Mason", "Helper"];

  function loadLabourNames(){
    try{
      const raw = localStorage.getItem(LABOUR_NAMES_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(e){}
    return DEFAULT_LABOUR_NAMES.slice();
  }

  function saveLabourNamesLocal(){
    try{
      localStorage.setItem(LABOUR_NAMES_KEY, JSON.stringify(labourNames));
    }catch(e){
      console.error("Local save (labour names) failed", e);
    }
  }

  function addLabourName(name){
    const trimmed = (name||"").trim();
    if(!trimmed) return false;
    const exists = labourNames.some(n=> n.toLowerCase() === trimmed.toLowerCase());
    if(!exists){
      labourNames.push(trimmed);
      saveLabourNamesLocal();
      pushToFirestore();
    }
    return true;
  }

  function renameLabourName(oldName, newName){
    const trimmed = (newName||"").trim();
    if(!trimmed || trimmed.toLowerCase() === oldName.toLowerCase()) return;
    const idx = labourNames.findIndex(n=> n === oldName);
    if(idx > -1) labourNames[idx] = trimmed;
    // Propagate the rename to every existing item using the old name
    state.forEach(stage=>{
      stage.items.forEach(item=>{
        if(isLabourItem(item) && item.name && item.name.trim().toLowerCase() === oldName.toLowerCase()){
          item.name = trimmed;
        }
      });
    });
    saveLabourNamesLocal();
    saveData();
  }

  function deleteLabourName(name){
    labourNames = labourNames.filter(n=> n !== name);
    saveLabourNamesLocal();
    pushToFirestore();
  }

  function saveLocal(){

  function setSyncStatus(mode){
    const el = document.getElementById("syncStatus");
    if(!el) return;
    el.classList.remove("synced","offline");
    if(mode === "synced"){
      el.textContent = "✓ Synced across devices";
      el.classList.add("synced");
    }else if(mode === "syncing"){
      el.textContent = "🔄 Syncing…";
    }else if(mode === "offline"){
      el.textContent = "⚠ Offline — saved on this device only";
      el.classList.add("offline");
    }else{
      el.textContent = "🔄 Connecting…";
    }
  }

  function pushToFirestore(){
    if(!firebaseReady || !docRef) return;
    clearTimeout(writeTimer);
    setSyncStatus("syncing");
    writeTimer = setTimeout(()=>{
      suppressNextSnapshot = true;
      docRef.set({ stages: state, labourNames: labourNames, updatedAt: Date.now() })
        .then(()=> setSyncStatus("synced"))
        .catch(e=>{
          console.error("Firestore write failed", e);
          setSyncStatus("offline");
        });
    }, 500);
  }

  function saveData(){
    saveLocal();
    pushToFirestore();
  }

  function initFirestoreSync(){
    if(!firebaseReady || !docRef) { setSyncStatus("offline"); return; }

    docRef.get().then(snap=>{
      if(!snap.exists){
        docRef.set({ stages: state, labourNames: labourNames, updatedAt: Date.now() })
          .then(()=> setSyncStatus("synced"))
          .catch(()=> setSyncStatus("offline"));
      }
    }).catch(()=> setSyncStatus("offline"));

    docRef.onSnapshot(snap=>{
      if(suppressNextSnapshot){
        suppressNextSnapshot = false;
        setSyncStatus("synced");
        return;
      }
      const data = snap.data();
      if(data && Array.isArray(data.stages)){
        state = migrateData(data.stages);
        saveLocal();
        if(Array.isArray(data.labourNames) && data.labourNames.length){
          labourNames = data.labourNames;
          saveLabourNamesLocal();
        }
        render();
        setSyncStatus("synced");
      }
    }, err=>{
      console.error("Firestore listen failed", err);
      setSyncStatus("offline");
    });
  }

    return stage.items.reduce((sum,it)=> sum + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  }
  function stageLabourTotal(stage){
    return stage.items.filter(isLabourItem).reduce((sum,it)=> sum + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  }
  function stageMaterialsTotal(stage){
    return stage.items.filter(it=>!isLabourItem(it)).reduce((sum,it)=> sum + (Number(it.qty)||0) * (Number(it.price)||0), 0);

  function stagePendingTotal(stage){

  }

  function showConfirm(message, onConfirm, confirmLabel){
    modalMessage.textContent = message;
    modalConfirmBtn.textContent = confirmLabel || "Delete";
    modalOverlay.style.display = "flex";

    function cleanup(){
      modalOverlay.style.display = "none";
      modalConfirmBtn.textContent = "Delete";
      modalConfirmBtn.removeEventListener("click", onConfirmClick);
      modalCancelBtn.removeEventListener("click", onCancelClick);
      modalOverlay.removeEventListener("click", onOverlayClick);
    }
    function onConfirmClick(){ cleanup(); onConfirm(); }
    function onCancelClick(){ cleanup(); }
    function onOverlayClick(e){ if(e.target === modalOverlay) cleanup(); }

    modalConfirmBtn.addEventListener("click", onConfirmClick);
    modalCancelBtn.addEventListener("click", onCancelClick);
    modalOverlay.addEventListener("click", onOverlayClick);
  }

    itemsWrap.className = "items-wrap";

    const filterActive = stageFilter.status !== "all" || stageFilter.type !== "all";
    const visibleItems = stage.items
      .map((item, iIdx)=> ({item, iIdx}))
      .filter(({item})=> itemMatchesStageFilter(item));

    if(stage.items.length > 0){
      if(visibleItems.length > 0){
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = "<tr>" +
          "<th>Item</th>" +
          "<th class='num'>Qty</th>" +
          "<th>Unit / Date</th>" +
          "<th class='num'>Price (Ksh)</th>" +
          "<th class='num'>Total</th>" +
          "<th>Status</th>" +
          "<th></th>" +
          "</tr>";
        table.appendChild(thead);

        const tbody = document.createElement("tbody");
        visibleItems.forEach(({item, iIdx})=>{
          tbody.appendChild(buildItemRow(stage, item, iIdx));
        });
        table.appendChild(tbody);
        const hint = document.createElement("div");
        hint.style.cssText = "font-size:10.5px;color:var(--muted);padding:6px 14px 0;";
        hint.textContent = "← swipe table to see all columns →";
        itemsWrap.appendChild(hint);
        const scrollWrap = document.createElement("div");
        scrollWrap.className = "table-scroll";
        scrollWrap.appendChild(table);
        itemsWrap.appendChild(scrollWrap);

        if(filterActive){
          const filteredSum = visibleItems.reduce((s,{item})=> s + (Number(item.qty)||0)*(Number(item.price)||0), 0);
          const ftDiv = document.createElement("div");
          ftDiv.className = "filtered-total";
          ftDiv.innerHTML = "Filtered total: " + fmt(filteredSum) + ' <span class="ft-count">(' + visibleItems.length + " of " + stage.items.length + " items)</span>";
          itemsWrap.appendChild(ftDiv);
        }
      }else{
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No items match the current filter.";
        itemsWrap.appendChild(empty);
      }
    }else{
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No items yet in this stage.";
      itemsWrap.appendChild(empty);
    }

    if(!isViewer()){
      const addRow = document.createElement("div");
      addRow.className = "addrow-group";

      const addBtn = document.createElement("button");
      addBtn.textContent = "+ Add Item";
      addBtn.addEventListener("click", ()=>{
        stage.items.push({name:"", qty:"", unit:"pcs", price:"", type:"material"});
        saveData();
        render();
      });
      addRow.appendChild(addBtn);

      const addLabourBtn = document.createElement("button");
      addLabourBtn.className = "labour-btn";
      addLabourBtn.textContent = "+ Add Labour";
      addLabourBtn.addEventListener("click", ()=>{
        stage.items.push({name:(labourNames[0]||"Labour"), qty:"", unit:"days", price:"", type:"labour", date:todayISO()});
        saveData();
        render();
      });
      addRow.appendChild(addLabourBtn);

      itemsWrap.appendChild(addRow);
    }
    stageEl.appendChild(itemsWrap);

    const foot = document.createElement("div");
    foot.className = "stage-foot";

    const totalsWrap = document.createElement("div");
    const labourTotal = stageLabourTotal(stage);
    const materialsTotal = stageMaterialsTotal(stage);

    const breakdown = document.createElement("div");
    breakdown.className = "rowline";
    breakdown.dataset.role = "stage-breakdown";
    breakdown.style.fontSize = "11px";
    breakdown.style.display = (labourTotal > 0 && materialsTotal > 0) ? "block" : "none";
    breakdown.textContent = "Materials: " + fmt(materialsTotal) + " · Labour: " + fmt(labourTotal);
    totalsWrap.appendChild(breakdown);

    const pendingTotal = stagePendingTotal(stage);
    const payBreakdown = document.createElement("div");
    payBreakdown.className = "rowline";
    payBreakdown.dataset.role = "stage-pay-breakdown";
    payBreakdown.style.fontSize = "11px";
    payBreakdown.style.display = stage.items.length > 0 ? "block" : "none";
    payBreakdown.innerHTML = 'Pending: <span style="color:#b3541b;font-weight:700;">' + fmt(pendingTotal) + '</span>';
    totalsWrap.appendChild(payBreakdown);

    const stTotal = document.createElement("div");
    stTotal.className = "stagetotal";
    stTotal.dataset.role = "stage-total";
    stTotal.textContent = "Stage total: " + fmt(stageTotal(stage));
    totalsWrap.appendChild(stTotal);

    foot.appendChild(totalsWrap);

    if(!isViewer()){
      const delStageBtn = document.createElement("button");
      delStageBtn.className = "stage-del";
      delStageBtn.textContent = "Delete stage";
      delStageBtn.addEventListener("click", ()=>{
        showConfirm('Delete stage "' + stage.name + '" and all its items?', ()=>{
          const idx = state.indexOf(stage);
          if(idx > -1) state.splice(idx,1);
          activeTab = "overview";
          saveData();
          render();
        });
      });
      foot.appendChild(delStageBtn);
    }

    stageEl.appendChild(foot);
    container.appendChild(stageEl);
  }

  // ---------- Labour page ----------
  function renderLabourPage(container){
    if(!isViewer()){
      const manageBtn = document.createElement("button");
      manageBtn.className = "manage-names-btn";
      manageBtn.textContent = "✎ Manage labour names";
      manageBtn.addEventListener("click", openNamesModal);
      container.appendChild(manageBtn);
    }

    const allEntries = [];
    state.forEach(stage=>{
      stage.items.forEach(item=>{
        if(isLabourItem(item)){
          allEntries.push({
            stageName: stage.name,
            role: item.name && item.name.trim() ? item.name.trim() : "Labour",
            date: item.date || "",
            qty: Number(item.qty)||0,
            price: Number(item.price)||0,
            total: (Number(item.qty)||0)*(Number(item.price)||0),
            status: item.status || "pending"
          });
        }
      });
    });

    if(allEntries.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No labour entries yet. Add labour from any stage page using \"+ Add Labour\".";
      container.appendChild(empty);
      return;
    }

    // Filter bar
    const filterBar = document.createElement("div");
    filterBar.className = "filter-bar";
    filterBar.style.borderRadius = "12px";
    filterBar.style.marginBottom = "12px";
    filterBar.style.border = "1px solid var(--border)";

    const roles = Array.from(new Set(allEntries.map(e=>e.role))).sort();
    const stageNames = Array.from(new Set(allEntries.map(e=>e.stageName))).sort();

    const roleSel = document.createElement("select");
    const roleAllOpt = document.createElement("option");
    roleAllOpt.value = "all"; roleAllOpt.textContent = "All roles";
    roleSel.appendChild(roleAllOpt);
    roles.forEach(r=>{
      const opt = document.createElement("option");
      opt.value = r; opt.textContent = r;
      if(labourFilter.role === r) opt.selected = true;
      roleSel.appendChild(opt);
    });
    if(labourFilter.role === "all") roleAllOpt.selected = true;
    roleSel.addEventListener("change", e=>{ labourFilter.role = e.target.value; render(); });
    filterBar.appendChild(roleSel);

    const stageSel = document.createElement("select");
    const stageAllOpt = document.createElement("option");
    stageAllOpt.value = "all"; stageAllOpt.textContent = "All stages";
    stageSel.appendChild(stageAllOpt);
    stageNames.forEach(sn=>{
      const opt = document.createElement("option");
      opt.value = sn; opt.textContent = sn;
      if(labourFilter.stage === sn) opt.selected = true;
      stageSel.appendChild(opt);
    });
    if(labourFilter.stage === "all") stageAllOpt.selected = true;
    stageSel.addEventListener("change", e=>{ labourFilter.stage = e.target.value; render(); });
    filterBar.appendChild(stageSel);

    const statusSel = document.createElement("select");
    [["all","All statuses"],["pending","Pending"],["paid","Paid"]].forEach(([val,label])=>{
      const opt = document.createElement("option");
      opt.value = val; opt.textContent = label;
      if(labourFilter.status === val) opt.selected = true;
      statusSel.appendChild(opt);
    });
    statusSel.addEventListener("change", e=>{ labourFilter.status = e.target.value; render(); });
    filterBar.appendChild(statusSel);

    container.appendChild(filterBar);

    const entries = allEntries.filter(e=>
      (labourFilter.role === "all" || e.role === labourFilter.role) &&
      (labourFilter.stage === "all" || e.stageName === labourFilter.stage) &&
      (labourFilter.status === "all" || e.status === labourFilter.status)
    );

    const filterActive = labourFilter.role !== "all" || labourFilter.stage !== "all" || labourFilter.status !== "all";

    if(entries.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No labour entries match the current filter.";
      container.appendChild(empty);
      return;
    }

    const grandLabour = entries.reduce((s,e)=> s+e.total, 0);
    const grandLabourPending = entries.filter(e=>e.status!=="paid").reduce((s,e)=> s+e.total, 0);
    const summary = document.createElement("div");
    summary.className = "grand-summary";
    summary.innerHTML =
      '<div class="gs-label">' + (filterActive ? "Filtered labour cost" : "Total labour cost") + '</div>' +
      '<div class="gs-value">' + fmt(grandLabour) + '</div>' +
      '<div class="gs-breakdown">Pending: <b>' + fmt(grandLabourPending) + '</b>' +
      (filterActive ? ' · <span class="ft-count">' + entries.length + ' of ' + allEntries.length + ' entries</span>' : '') +
      '</div>';
    container.appendChild(summary);

    // Group by role
    const roleMap = {};
    entries.forEach(e=>{
      if(!roleMap[e.role]) roleMap[e.role] = [];
      roleMap[e.role].push(e);
    });

    Object.keys(roleMap).sort().forEach(roleName=>{
      const roleEntries = roleMap[roleName].slice().sort((a,b)=> (b.date||"").localeCompare(a.date||""));
      const roleTotal = roleEntries.reduce((s,e)=> s+e.total, 0);

      const card = document.createElement("div");
      card.className = "labour-role-card";

      const head = document.createElement("div");
      head.className = "labour-role-head";
      head.innerHTML =
        '<div class="role-name">' + roleName + '</div>' +
        '<div class="role-total">' + fmt(roleTotal) + '</div>';
      card.appendChild(head);

      roleEntries.forEach(e=>{
        const row = document.createElement("div");
        row.className = "labour-entry";
        const left = document.createElement("div");
        left.className = "le-left";
        left.innerHTML = fmtDateWithDow(e.date) + '<div class="le-stage">' + e.stageName + ' · ' + e.qty + ' days @ ' + fmt(e.price) + '</div>';
        const right = document.createElement("div");
        right.style.textAlign = "right";
        right.innerHTML =
          '<div class="le-right">' + fmt(e.total) + '</div>' +
          '<div class="status-tag status-' + e.status + '" style="margin-top:3px;">' + e.status.toUpperCase() + '</div>';
        row.appendChild(left);
        row.appendChild(right);
        card.appendChild(row);
      });

      container.appendChild(card);
    });
  }

  // ---------- Page router ----------
  function renderPageContent(){
    pageContentEl.innerHTML = "";

    if(activeTab === "overview"){
      renderOverviewPage(pageContentEl);
    }else if(activeTab === "labour"){
      renderLabourPage(pageContentEl);
    }else if(activeTab.indexOf("stage:") === 0){
      const id = activeTab.slice(6);
      const stage = state.find(s=> s.id === id);
      if(stage){
        renderStagePage(pageContentEl, stage);
      }else{
        activeTab = "overview";
        renderOverviewPage(pageContentEl);
      }
    }else{
      activeTab = "overview";
      renderOverviewPage(pageContentEl);
    }
  }

  function render(){
    renderNav();
    renderPageContent();
    grandTotalEl.textContent = fmt(grandTotalAll());
    itemCountEl.textContent = totalItemCount();
  }

  // Lightweight totals refresh for the currently open stage page (keeps focus while typing)
  function updateTotalsOnly(stage){
    const lineTotals = pageContentEl.querySelectorAll("[data-role='line-total']");
    stage.items.forEach((item, iIdx)=>{
      if(lineTotals[iIdx]){
        lineTotals[iIdx].textContent = fmt((Number(item.qty)||0)*(Number(item.price)||0));
      }
    });
    const stTotalEl = pageContentEl.querySelector("[data-role='stage-total']");
    if(stTotalEl) stTotalEl.textContent = "Stage total: " + fmt(stageTotal(stage));

    const breakdownEl = pageContentEl.querySelector("[data-role='stage-breakdown']");
    if(breakdownEl){
      const labourTotal = stageLabourTotal(stage);
      const materialsTotal = stageMaterialsTotal(stage);
      breakdownEl.style.display = (labourTotal > 0 && materialsTotal > 0) ? "block" : "none";
      breakdownEl.textContent = "Materials: " + fmt(materialsTotal) + " · Labour: " + fmt(labourTotal);
    }

    const payBreakdownEl = pageContentEl.querySelector("[data-role='stage-pay-breakdown']");
    if(payBreakdownEl){
      const pendingTotal = stagePendingTotal(stage);
      payBreakdownEl.innerHTML = 'Pending: <span style="color:#b3541b;font-weight:700;">' + fmt(pendingTotal) + '</span>';
    }

    grandTotalEl.textContent = fmt(grandTotalAll());
  }

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    showConfirm("Reset to the sample Slab / Wall / Lintel / Roofing data? This replaces everything currently entered.", ()=>{
      state = migrateData(JSON.parse(JSON.stringify(SAMPLE_DATA)));
      activeTab = "overview";
      saveData();
      render();
    });
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 15;
      doc.setFontSize(16);
      doc.text("House Construction - Materials & Costs", 14, y);
      y += 10;
      doc.setFontSize(10);
      let grand = 0;

      state.forEach(stage=>{
        if(stage.items.length === 0) return;
        if(y > 270){ doc.addPage(); y = 15; }
        doc.setFontSize(12);
        doc.setFont(undefined, "bold");
        doc.text(stage.name, 14, y);
        y += 6;
        doc.setFont(undefined, "normal");
        doc.setFontSize(9);
        doc.text("Item", 14, y);
        doc.text("Qty", 78, y);
        doc.text("Unit/Date", 96, y);
        doc.text("Price", 122, y);
        doc.text("Total", 150, y);
        doc.text("Status", 175, y);
        y += 5;
        doc.setDrawColor(200);
        doc.line(14,y-2,196,y-2);

        let stageTot = 0;
        stage.items.forEach(item=>{
          if(y > 280){ doc.addPage(); y = 15; }
          const lineTotal = (Number(item.qty)||0)*(Number(item.price)||0);
          stageTot += lineTotal;
          const unitOrDate = isLabourItem(item) ? (item.date ? item.date + " " + dowLabel(item.date) : "") : (item.unit || "");
          doc.text(String(item.name||""), 14, y);
          doc.text(String(item.qty||""), 78, y);
          doc.text(String(unitOrDate), 96, y);
          doc.text((Number(item.price)||0).toLocaleString("en-KE"), 122, y);
          doc.text(lineTotal.toLocaleString("en-KE"), 150, y);
          doc.text((item.status||"pending").toUpperCase(), 175, y);
          y += 6;
        });
        grand += stageTot;
        doc.setFont(undefined,"bold");
        doc.text("Stage total: Ksh " + stageTot.toLocaleString("en-KE"), 140, y, {maxWidth:60});
        doc.setFont(undefined,"normal");
        y += 10;
      });

      if(y > 270){ doc.addPage(); y = 15; }
      doc.setFontSize(13);
      doc.setFont(undefined,"bold");
      doc.text("GRAND TOTAL: Ksh " + grand.toLocaleString("en-KE"), 14, y);

      doc.save("house-construction-costs.pdf");
    }catch(e){
      alert("PDF export failed: " + e.message);
    }
  });

  document.addEventListener("focusout", saveData);

  // ---------- PIN lock / role handling ----------
  const lockOverlay = document.getElementById("lockOverlay");
  const lockPinInput = document.getElementById("lockPinInput");
  const lockUnlockBtn = document.getElementById("lockUnlockBtn");
  const lockError = document.getElementById("lockError");
  const roleBadge = document.getElementById("roleBadge");

  function applyRoleUI(){
    if(role === "admin"){
      roleBadge.textContent = "🔓 Admin — tap to switch user";
    }else if(role === "viewer"){
      roleBadge.textContent = "👁 View only — tap to switch user";
    }else{
      roleBadge.textContent = "🔒 …";
    }
    const resetBtnEl = document.getElementById("resetBtn");
    if(resetBtnEl) resetBtnEl.style.display = isViewer() ? "none" : "block";
    render();
  }

  function showLock(){
    lockOverlay.style.display = "flex";
    lockPinInput.value = "";
    lockError.textContent = "";
    setTimeout(()=> lockPinInput.focus(), 100);
  }

  function tryUnlock(){
    const val = lockPinInput.value.trim();
    if(val === ADMIN_PIN){
      role = "admin";
    }else if(val === VIEWER_PIN){
      role = "viewer";
    }else{
      lockError.textContent = "Incorrect PIN. Try again.";
      lockPinInput.value = "";
      lockPinInput.focus();
      return;
    }
    try{ localStorage.setItem(ROLE_KEY, role); }catch(e){}
    lockOverlay.style.display = "none";
    applyRoleUI();
  }

  lockUnlockBtn.addEventListener("click", tryUnlock);
  lockPinInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") tryUnlock();
  });

  roleBadge.addEventListener("click", ()=>{
    showConfirm("Switch user? You'll need to enter a PIN again.", ()=>{
      role = null;
      try{ localStorage.removeItem(ROLE_KEY); }catch(e){}
      showLock();
    }, "Switch User");
  });

  document.getElementById("hamburgerBtn").addEventListener("click", openSidebar);
  document.getElementById("navTrigger").addEventListener("click", openSidebar);
  document.getElementById("sidebarCloseBtn").addEventListener("click", closeSidebar);
  sidebarOverlay.addEventListener("click", (e)=>{
    if(e.target === sidebarOverlay) closeSidebar();
  });

  // ---------- Manage labour names modal ----------
  const namesModalOverlay = document.getElementById("namesModalOverlay");
  const namesListEl = document.getElementById("namesList");
  const newNameInput = document.getElementById("newNameInput");

  function renderNamesList(){
    namesListEl.innerHTML = "";
    if(labourNames.length === 0){
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.style.padding = "10px 0";
      empty.textContent = "No names yet. Add one below.";
      namesListEl.appendChild(empty);
      return;
    }
    labourNames.forEach(name=>{
      const row = document.createElement("div");
      row.className = "name-row";

      const inp = document.createElement("input");
      inp.value = name;
      inp.addEventListener("change", e=>{
        renameLabourName(name, e.target.value);
        renderNamesList();
        render();
      });
      row.appendChild(inp);

      const delBtn = document.createElement("button");
      delBtn.textContent = "✕";
      delBtn.addEventListener("click", ()=>{
        showConfirm('Remove "' + name + '" from the names list? Existing entries already using this name are not changed.', ()=>{
          deleteLabourName(name);
          renderNamesList();
          render();
        }, "Remove");
      });
      row.appendChild(delBtn);

      namesListEl.appendChild(row);
    });
  }

  function openNamesModal(){
    renderNamesList();
    newNameInput.value = "";
    namesModalOverlay.style.display = "flex";
  }
  function closeNamesModal(){
    namesModalOverlay.style.display = "none";
  }

  document.getElementById("newNameAddBtn").addEventListener("click", ()=>{
    const val = newNameInput.value.trim();
    if(val){
      addLabourName(val);
      newNameInput.value = "";
      renderNamesList();
      render();
    }
  });
  newNameInput.addEventListener("keydown", e=>{
    if(e.key === "Enter") document.getElementById("newNameAddBtn").click();
  });
  document.getElementById("namesModalCloseBtn").addEventListener("click", closeNamesModal);
  namesModalOverlay.addEventListener("click", e=>{
    if(e.target === namesModalOverlay) closeNamesModal();
  });

  if(role === "admin" || role === "viewer"){
    lockOverlay.style.display = "none";
  }else{
    showLock();
  }
  applyRoleUI();

  initFirestoreSync();
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }

  let deferredInstallPrompt = null;
  const installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", (e)=>{
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "block";
  });
  installBtn.addEventListener("click", async ()=>{
    if(!deferredInstallPrompt) return;
    installBtn.style.display = "none";
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  });
  window.addEventListener("appinstalled", ()=>{
    installBtn.style.display = "none";
  });
})();
</script>
</body>
</html>
