<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<title>House Construction Tracker</title>
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --green-dark:#1b4332;
    --green:#2d6a4f;
    --green-light:#40916c;
    --gold:#d4a017;
    --gold-light:#f1c453;
    --bg:#f7f6f2;
    --card:#ffffff;
    --text:#1b2a22;
    --muted:#6b7a70;
    --border:#e2e4df;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100dvh;
  }
  body{
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    background:linear-gradient(135deg,var(--green-dark),var(--green));
    color:#fff;
    padding:18px 16px 16px;
    position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  header h1{
    margin:0;
    font-size:19px;
    font-weight:700;
    letter-spacing:.2px;
  }
  header .sub{
    font-size:12px;
    opacity:.85;
    margin-top:2px;
  }
  .totalbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:12px;
    background:rgba(255,255,255,.12);
    border-radius:10px;
    padding:10px 12px;
  }
  .totalbar .label{font-size:12px;opacity:.85;}
  .totalbar .value{font-size:20px;font-weight:800;color:var(--gold-light);}
  main{padding:14px 12px 100px;max-width:720px;margin:0 auto;}
  .stage{
    background:var(--card);
    border-radius:14px;
    margin-bottom:14px;
    box-shadow:0 1px 3px rgba(0,0,0,.08);
    border:1px solid var(--border);
    overflow:hidden;
  }
  .stage-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 14px;
    cursor:pointer;
    background:linear-gradient(180deg,#fff,#fbfaf7);
  }
  .stage-head .name{
    font-size:16px;
    font-weight:700;
    color:var(--green-dark);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .stage-head .name input{
    border:none;background:transparent;font-weight:700;font-size:16px;color:var(--green-dark);
    width:100%;padding:2px 0;
  }
  .stage-sub{
    font-size:12px;color:var(--muted);margin-top:2px;
  }
  .chev{
    font-size:13px;color:var(--muted);
    transition:transform .2s ease;
    padding:6px;
  }
  .stage.collapsed .chev{transform:rotate(-90deg);}
  .stage.collapsed .items-wrap{display:none;}
  .items-wrap{border-top:1px solid var(--border);}
  table{width:100%;border-collapse:collapse;}
  th{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;
    color:var(--muted);text-align:left;padding:8px 6px;
    background:#f4f3ef;
  }
  th.num,td.num{text-align:right;}
  td{padding:8px 6px;border-top:1px solid var(--border);vertical-align:middle;}
  td input{
    width:100%;border:1px solid transparent;background:transparent;
    font-size:16px;padding:6px 4px;border-radius:6px;color:var(--text);
    font-family:inherit;
  }
  td input:focus{border:1px solid var(--green-light);background:#fff;outline:none;}
  td.qty input, td.price input{text-align:right;}
  .item-name{min-width:0;}
  .rowline{color:var(--muted);font-size:13px;}
  .del-btn{
    background:none;border:none;color:#b3413b;font-size:18px;
    padding:4px 8px;cursor:pointer;line-height:1;
  }
  .addrow{
    display:flex;justify-content:center;padding:10px;
  }
  .addrow button{
    background:none;border:1.5px dashed var(--green-light);
    color:var(--green);font-size:13px;font-weight:600;
    padding:8px 16px;border-radius:20px;cursor:pointer;
    width:100%;
  }
  .stage-foot{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 14px;background:#f4f3ef;
    border-top:1px solid var(--border);
  }
  .stage-foot .stagetotal{font-weight:700;color:var(--green-dark);}
  .stage-del{
    background:none;border:none;color:#b3413b;font-size:12px;
    cursor:pointer;padding:4px;
  }
  .add-stage-btn{
    display:block;width:100%;
    background:var(--green-dark);color:#fff;
    border:none;border-radius:12px;
    padding:14px;font-size:15px;font-weight:700;
    margin-top:6px;cursor:pointer;
  }
  .add-stage-btn:active{background:var(--green);}
  .toolbar{
    display:flex;gap:8px;margin-bottom:14px;
  }
  .toolbar button{
    flex:1;padding:10px;border-radius:10px;border:1px solid var(--border);
    background:#fff;color:var(--green-dark);font-size:13px;font-weight:600;
    cursor:pointer;
  }
  .toolbar button.primary{
    background:var(--gold);color:#3a2b00;border-color:var(--gold);
  }
  footer{
    text-align:center;color:var(--muted);font-size:11px;padding:14px;
  }
  .empty{
    text-align:center;color:var(--muted);padding:30px 10px;font-size:13px;
  }
  .unit-select{
    width:100%;border:none;background:transparent;font-size:14px;color:var(--text);
    font-family:inherit;padding:6px 2px;
  }
  select:focus, .unit-select:focus{outline:none;border:1px solid var(--green-light);border-radius:6px;background:#fff;}

  .icon-btn{
    background:none;border:none;color:var(--muted);font-size:16px;
    padding:6px 8px;cursor:pointer;line-height:1;border-radius:8px;
  }
  .icon-btn:active{background:rgba(0,0,0,.06);}
  .icon-btn.active{color:var(--green-dark);background:rgba(45,106,79,.12);}
  .reorder-controls{
    display:flex;gap:2px;align-items:center;
  }
  .reorder-controls button{
    background:none;border:1px solid var(--border);color:var(--green-dark);
    font-size:13px;padding:4px 8px;border-radius:6px;cursor:pointer;
  }
  .reorder-controls button:disabled{opacity:.3;cursor:default;}
  .stage-head-row{
    display:flex;align-items:center;gap:2px;
  }
  .addrow-group{
    display:flex;gap:8px;padding:10px;
  }
  .addrow-group button{
    flex:1;
    background:none;border:1.5px dashed var(--green-light);
    color:var(--green);font-size:13px;font-weight:600;
    padding:8px 10px;border-radius:20px;cursor:pointer;
  }
  .addrow-group button.labour-btn{
    border-color:var(--gold);color:#8a6a00;
  }

  /* Confirm modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.45);
    display:flex;align-items:center;justify-content:center;
    z-index:100;padding:20px;
  }
  .modal-box{
    background:#fff;border-radius:14px;padding:20px;
    max-width:340px;width:100%;
    box-shadow:0 8px 30px rgba(0,0,0,.25);
  }
  .modal-box p{
    margin:0 0 18px;font-size:14.5px;color:var(--text);line-height:1.4;
  }
  .modal-actions{
    display:flex;gap:10px;
  }
  .modal-actions button{
    flex:1;padding:11px;border-radius:10px;border:none;
    font-size:14px;font-weight:700;cursor:pointer;
  }
  .modal-cancel{background:#eee;color:var(--text);}
  .modal-confirm{background:#b3413b;color:#fff;}
</style>
</head>
<body>

<header>
  <h1>🏗️ House Construction Tracker</h1>
  <div class="sub">Materials, quantities &amp; costs by stage</div>
  <div class="totalbar">
    <div>
      <div class="label">Grand Total</div>
      <div class="value" id="grandTotal">Ksh 0</div>
    </div>
    <div style="text-align:right;">
      <div class="label">Items</div>
      <div class="value" id="itemCount" style="font-size:16px;">0</div>
    </div>
  </div>
</header>

<main>
  <div class="toolbar">
    <button id="exportBtn">⬇ Export PDF</button>
    <button id="resetBtn">↺ Reset Sample</button>
  </div>

  <div id="stagesContainer"></div>

  <button class="add-stage-btn" id="addStageBtn">+ Add New Stage</button>

  <footer>House Construction Tracker · works offline · data saved on this device</footer>
</main>

<div id="modalOverlay" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <p id="modalMessage"></p>
    <div class="modal-actions">
      <button class="modal-cancel" id="modalCancelBtn">Cancel</button>
      <button class="modal-confirm" id="modalConfirmBtn">Delete</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function(){
  "use strict";

  const STORAGE_KEY = "houseConstructionData_v1";
  const UNITS = ["pcs","tonnes","bags","rolls","offs","m","m2","m3","litres","kg","other"];

  const SAMPLE_DATA = [
    {
      name: "Slab",
      collapsed: false,
      items: [
        {name:"D10 (rebar)", qty:24, unit:"pcs", price:0},
        {name:"D8 (rebar)", qty:16, unit:"pcs", price:0},
        {name:"Murram", qty:7, unit:"tonnes", price:0},
        {name:"Waterproof polythene", qty:1, unit:"rolls", price:0},
        {name:"Offcuts", qty:17, unit:"offs", price:0},
        {name:"Binding wire", qty:1, unit:"rolls", price:0},
        {name:"Hoop iron", qty:1, unit:"rolls", price:0},
        {name:"Cement", qty:20, unit:"bags", price:0},
        {name:"B.R.C mesh", qty:1, unit:"rolls", price:0},
        {name:"Stones", qty:800, unit:"pcs", price:0},
        {name:"Sand", qty:14, unit:"tonnes", price:0},
        {name:"Ballast", qty:14, unit:"tonnes", price:0}
      ]
    },
    {
      name: "Lintel",
      collapsed: false,
      items: [
        {name:"D10 (rebar)", qty:10, unit:"pcs", price:0},
        {name:"D8 (rebar)", qty:5, unit:"pcs", price:0}
      ]
    }
  ];

  function loadData(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(Array.isArray(parsed) && parsed.length) return parsed;
      }
    }catch(e){}
    return JSON.parse(JSON.stringify(SAMPLE_DATA));
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }catch(e){
      console.error("Save failed", e);
    }
  }

  let state = loadData();

  const stagesContainer = document.getElementById("stagesContainer");
  const grandTotalEl = document.getElementById("grandTotal");
  const itemCountEl = document.getElementById("itemCount");

  function fmt(n){
    if(isNaN(n)) n = 0;
    return "Ksh " + n.toLocaleString("en-KE", {maximumFractionDigits:2});
  }

  function stageTotal(stage){
    return stage.items.reduce((sum,it)=> sum + (Number(it.qty)||0) * (Number(it.price)||0), 0);
  }

  // Custom confirm dialog (replaces browser confirm())
  const modalOverlay = document.getElementById("modalOverlay");
  const modalMessage = document.getElementById("modalMessage");
  const modalCancelBtn = document.getElementById("modalCancelBtn");
  const modalConfirmBtn = document.getElementById("modalConfirmBtn");

  function showConfirm(message, onConfirm){
    modalMessage.textContent = message;
    modalOverlay.style.display = "flex";

    function cleanup(){
      modalOverlay.style.display = "none";
      modalConfirmBtn.removeEventListener("click", onConfirmClick);
      modalCancelBtn.removeEventListener("click", onCancelClick);
      modalOverlay.removeEventListener("click", onOverlayClick);
    }
    function onConfirmClick(){ cleanup(); onConfirm(); }
    function onCancelClick(){ cleanup(); }
    function onOverlayClick(e){ if(e.target === modalOverlay) cleanup(); }

    modalConfirmBtn.addEventListener("click", onConfirmClick);
    modalCancelBtn.addEventListener("click", onCancelClick);
    modalOverlay.addEventListener("click", onOverlayClick);
  }

  function render(){
    stagesContainer.innerHTML = "";

    if(state.length === 0){
      const div = document.createElement("div");
      div.className = "empty";
      div.textContent = "No stages yet. Tap \"Add New Stage\" to begin.";
      stagesContainer.appendChild(div);
    }

    let grand = 0;
    let totalItems = 0;

    state.forEach((stage, sIdx) => {
      const total = stageTotal(stage);
      grand += total;
      totalItems += stage.items.length;

      const stageEl = document.createElement("div");
      stageEl.className = "stage" + (stage.collapsed ? " collapsed" : "");

      // Header
      const head = document.createElement("div");
      head.className = "stage-head";

      const nameWrap = document.createElement("div");
      nameWrap.style.flex = "1";
      nameWrap.style.minWidth = "0";

      const nameDiv = document.createElement("div");
      nameDiv.className = "name";
      const nameInput = document.createElement("input");
      nameInput.value = stage.name;
      nameInput.placeholder = "Stage name";
      nameInput.addEventListener("click", e => e.stopPropagation());
      nameInput.addEventListener("input", e => {
        stage.name = e.target.value;
        saveData();
      });
      nameDiv.appendChild(nameInput);
      nameWrap.appendChild(nameDiv);

      const subDiv = document.createElement("div");
      subDiv.className = "stage-sub";
      subDiv.textContent = stage.items.length + " item" + (stage.items.length===1?"":"s");
      nameWrap.appendChild(subDiv);

      head.appendChild(nameWrap);

      const headControls = document.createElement("div");
      headControls.className = "stage-head-row";

      if(stage.editMode){
        const reorder = document.createElement("div");
        reorder.className = "reorder-controls";

        const upBtn = document.createElement("button");
        upBtn.textContent = "▲";
        upBtn.disabled = (sIdx === 0);
        upBtn.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(sIdx > 0){
            [state[sIdx-1], state[sIdx]] = [state[sIdx], state[sIdx-1]];
            saveData();
            render();
          }
        });
        reorder.appendChild(upBtn);

        const downBtn = document.createElement("button");
        downBtn.textContent = "▼";
        downBtn.disabled = (sIdx === state.length - 1);
        downBtn.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(sIdx < state.length - 1){
            [state[sIdx+1], state[sIdx]] = [state[sIdx], state[sIdx+1]];
            saveData();
            render();
          }
        });
        reorder.appendChild(downBtn);

        headControls.appendChild(reorder);
      }

      const editBtn = document.createElement("button");
      editBtn.className = "icon-btn" + (stage.editMode ? " active" : "");
      editBtn.textContent = "✎";
      editBtn.title = "Edit stage name / reorder";
      editBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        stage.editMode = !stage.editMode;
        render();
      });
      headControls.appendChild(editBtn);

      const chev = document.createElement("div");
      chev.className = "chev";
      chev.textContent = "▾";
      headControls.appendChild(chev);

      head.appendChild(headControls);

      head.addEventListener("click", () => {
        stage.collapsed = !stage.collapsed;
        render();
      });

      stageEl.appendChild(head);

      // Items table
      const itemsWrap = document.createElement("div");
      itemsWrap.className = "items-wrap";

      if(stage.items.length > 0){
        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = "<tr>" +
          "<th>Item</th>" +
          "<th class='num'>Qty</th>" +
          "<th>Unit</th>" +
          "<th class='num'>Price (Ksh)</th>" +
          "<th class='num'>Total</th>" +
          "<th></th>" +
          "</tr>";
        table.appendChild(thead);

        const tbody = document.createElement("tbody");

        stage.items.forEach((item, iIdx) => {
          const tr = document.createElement("tr");

          // Name
          const tdName = document.createElement("td");
          tdName.className = "item-name";
          const nameInp = document.createElement("input");
          nameInp.value = item.name;
          nameInp.placeholder = "Item name";
          nameInp.addEventListener("input", e=>{
            item.name = e.target.value;
            saveData();
          });
          tdName.appendChild(nameInp);
          tr.appendChild(tdName);

          // Qty
          const tdQty = document.createElement("td");
          tdQty.className = "qty num";
          const qtyInp = document.createElement("input");
          qtyInp.type = "number";
          qtyInp.inputMode = "decimal";
          qtyInp.value = item.qty;
          qtyInp.style.width = "70px";
          qtyInp.addEventListener("input", e=>{
            item.qty = e.target.value;
            saveData();
            updateTotalsOnly();
          });
          tdQty.appendChild(qtyInp);
          tr.appendChild(tdQty);

          // Unit
          const tdUnit = document.createElement("td");
          const unitSel = document.createElement("select");
          unitSel.className = "unit-select";
          UNITS.forEach(u=>{
            const opt = document.createElement("option");
            opt.value = u; opt.textContent = u;
            if(item.unit === u) opt.selected = true;
            unitSel.appendChild(opt);
          });
          unitSel.addEventListener("change", e=>{
            item.unit = e.target.value;
            saveData();
          });
          tdUnit.appendChild(unitSel);
          tr.appendChild(tdUnit);

          // Price
          const tdPrice = document.createElement("td");
          tdPrice.className = "price num";
          const priceInp = document.createElement("input");
          priceInp.type = "number";
          priceInp.inputMode = "decimal";
          priceInp.value = item.price;
          priceInp.placeholder = "0";
          priceInp.style.width = "90px";
          priceInp.addEventListener("input", e=>{
            item.price = e.target.value;
            saveData();
            updateTotalsOnly();
          });
          tdPrice.appendChild(priceInp);
          tr.appendChild(tdPrice);

          // Line total
          const tdTotal = document.createElement("td");
          tdTotal.className = "num rowline";
          tdTotal.dataset.role = "line-total";
          tdTotal.textContent = fmt((Number(item.qty)||0)*(Number(item.price)||0));
          tr.appendChild(tdTotal);

          // Delete
          const tdDel = document.createElement("td");
          const delBtn = document.createElement("button");
          delBtn.className = "del-btn";
          delBtn.textContent = "✕";
          delBtn.addEventListener("click", ()=>{
            const itemLabel = item.name && item.name.trim() ? item.name.trim() : "this item";
            showConfirm('Delete "' + itemLabel + '"?', ()=>{
              stage.items.splice(iIdx,1);
              saveData();
              render();
            });
          });
          tdDel.appendChild(delBtn);
          tr.appendChild(tdDel);

          tbody.appendChild(tr);
        });

        table.appendChild(tbody);
        itemsWrap.appendChild(table);
      }

      // Add item / add labour row
      const addRow = document.createElement("div");
      addRow.className = "addrow-group";

      const addBtn = document.createElement("button");
      addBtn.textContent = "+ Add Item";
      addBtn.addEventListener("click", ()=>{
        stage.items.push({name:"", qty:"", unit:"pcs", price:""});
        saveData();
        render();
      });
      addRow.appendChild(addBtn);

      const addLabourBtn = document.createElement("button");
      addLabourBtn.className = "labour-btn";
      addLabourBtn.textContent = "+ Add Labour";
      addLabourBtn.addEventListener("click", ()=>{
        stage.items.push({name:"Labour", qty:"", unit:"days", price:""});
        saveData();
        render();
      });
      addRow.appendChild(addLabourBtn);

      itemsWrap.appendChild(addRow);

      stageEl.appendChild(itemsWrap);

      // Footer
      const foot = document.createElement("div");
      foot.className = "stage-foot";
      const stTotal = document.createElement("div");
      stTotal.className = "stagetotal";
      stTotal.dataset.role = "stage-total";
      stTotal.textContent = "Stage total: " + fmt(total);
      foot.appendChild(stTotal);

      const delStageBtn = document.createElement("button");
      delStageBtn.className = "stage-del";
      delStageBtn.textContent = "Delete stage";
      delStageBtn.addEventListener("click", ()=>{
        showConfirm('Delete stage "' + stage.name + '" and all its items?', ()=>{
          state.splice(sIdx,1);
          saveData();
          render();
        });
      });
      foot.appendChild(delStageBtn);

      stageEl.appendChild(foot);

      stagesContainer.appendChild(stageEl);
    });

    grandTotalEl.textContent = fmt(grand);
    itemCountEl.textContent = totalItems;
  }

  // Lightweight update for totals without full re-render (keeps focus while typing)
  function updateTotalsOnly(){
    let grand = 0;
    document.querySelectorAll(".stage").forEach((stageEl, sIdx)=>{
      const stage = state[sIdx];
      if(!stage) return;
      const total = stageTotal(stage);
      grand += total;
      const lineTotals = stageEl.querySelectorAll("[data-role='line-total']");
      stage.items.forEach((item, iIdx)=>{
        if(lineTotals[iIdx]){
          lineTotals[iIdx].textContent = fmt((Number(item.qty)||0)*(Number(item.price)||0));
        }
      });
      const stTotalEl = stageEl.querySelector("[data-role='stage-total']");
      if(stTotalEl) stTotalEl.textContent = "Stage total: " + fmt(total);
    });
    grandTotalEl.textContent = fmt(grand);
  }

  document.getElementById("addStageBtn").addEventListener("click", ()=>{
    state.push({name:"New Stage", collapsed:false, items:[]});
    saveData();
    render();
  });

  document.getElementById("resetBtn").addEventListener("click", ()=>{
    showConfirm("Reset to the sample Slab & Lintel data? This replaces everything currently entered.", ()=>{
      state = JSON.parse(JSON.stringify(SAMPLE_DATA));
      saveData();
      render();
    });
  });

  document.getElementById("exportBtn").addEventListener("click", ()=>{
    try{
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      let y = 15;
      doc.setFontSize(16);
      doc.text("House Construction - Materials & Costs", 14, y);
      y += 10;
      doc.setFontSize(10);
      let grand = 0;

      state.forEach(stage=>{
        if(y > 270){ doc.addPage(); y = 15; }
        doc.setFontSize(12);
        doc.setFont(undefined, "bold");
        doc.text(stage.name, 14, y);
        y += 6;
        doc.setFont(undefined, "normal");
        doc.setFontSize(9);
        doc.text("Item", 14, y);
        doc.text("Qty", 90, y);
        doc.text("Unit", 115, y);
        doc.text("Price", 140, y);
        doc.text("Total", 170, y);
        y += 5;
        doc.setDrawColor(200);
        doc.line(14,y-2,196,y-2);

        let stageTot = 0;
        stage.items.forEach(item=>{
          if(y > 280){ doc.addPage(); y = 15; }
          const lineTotal = (Number(item.qty)||0)*(Number(item.price)||0);
          stageTot += lineTotal;
          doc.text(String(item.name||""), 14, y);
          doc.text(String(item.qty||""), 90, y);
          doc.text(String(item.unit||""), 115, y);
          doc.text((Number(item.price)||0).toLocaleString("en-KE"), 140, y);
          doc.text(lineTotal.toLocaleString("en-KE"), 170, y);
          y += 6;
        });
        grand += stageTot;
        doc.setFont(undefined,"bold");
        doc.text("Stage total: Ksh " + stageTot.toLocaleString("en-KE"), 140, y, {maxWidth:60});
        doc.setFont(undefined,"normal");
        y += 10;
      });

      if(y > 270){ doc.addPage(); y = 15; }
      doc.setFontSize(13);
      doc.setFont(undefined,"bold");
      doc.text("GRAND TOTAL: Ksh " + grand.toLocaleString("en-KE"), 14, y);

      doc.save("house-construction-costs.pdf");
    }catch(e){
      alert("PDF export failed: " + e.message);
    }
  });

  // Save periodically on blur of number inputs to avoid losing focus mid-type
  document.addEventListener("focusout", saveData);

  render();

  // Register service worker for offline use
  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
